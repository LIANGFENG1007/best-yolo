name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v, for example 1.3.1"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  DEBIAN_REVISION: "1"

jobs:
  deb:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: packaging/requirements-deb.lock
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev desktop-file-utils appstream ffmpeg libegl1 libxcb-cursor0 libxkbcommon-x11-0
          python -m pip install -r packaging/requirements-deb.lock
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -B gui/test_gui.py
          python -B gui/test_shortcuts.py
          python -B gui/test_themes.py
          python -B gui/test_update_dialog_qt.py
          python -B gui/test_updates.py
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            TAG="v$INPUT_VERSION"
          else
            TAG="$GITHUB_REF_NAME"
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          APP_VERSION="$(PYTHONPATH=gui python -c 'from appmeta import APP_VERSION; print(APP_VERSION)')"
          if [ "$VERSION" != "$APP_VERSION" ]; then
            echo "发布版本 $VERSION 与应用版本 $APP_VERSION 不一致" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Build Debian package
        run: python packaging/build_deb.py --version "${{ steps.version.outputs.version }}-${DEBIAN_REVISION}"
      - name: Validate package
        run: |
          (
            cd dist
            sha256sum -c *.deb.sha256
          )
          dpkg-deb -I dist/*.deb
          VERIFY_DIR="$(mktemp -d)"
          dpkg-deb -x dist/*.deb "$VERIFY_DIR"
          desktop-file-validate "$VERIFY_DIR/usr/share/applications/best-yolo.desktop"
          appstreamcli validate --no-net "$VERIFY_DIR/usr/share/metainfo/best-yolo.metainfo.xml"
          PACKAGED_VERSION="$(PYTHONPATH="$VERIFY_DIR/opt/best-yolo/app/gui" python -c 'from appmeta import APP_VERSION; print(APP_VERSION)')"
          test "$PACKAGED_VERSION" = "${{ steps.version.outputs.version }}"
          test -f "$VERIFY_DIR/opt/best-yolo/app/gui/update_check.py"
          test -f "$VERIFY_DIR/opt/best-yolo/app/gui/theme_settings.py"
      - uses: actions/upload-artifact@v4
        with:
          name: best-yolo-${{ steps.version.outputs.version }}-ubuntu22.04-amd64
          retention-days: 7
          path: |
            dist/*.deb
            dist/*.deb.sha256
            dist/INSTALL-Ubuntu22.04-zh-CN.txt

  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            packaging/requirements-deb.lock
            packaging/requirements-windows-build.lock
      - name: Install Python build dependencies
        run: |
          python -m pip install --disable-pip-version-check -r packaging/requirements-deb.lock -r packaging/requirements-windows-build.lock
      - name: Locate Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 is missing: $iscc" }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Inno Setup: $iscc"
      - name: Download and verify Microsoft Visual C++ runtime
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "VC_redist.x64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile $target
          $signature = Get-AuthenticodeSignature $target
          if ($signature.Status -ne "Valid") { throw "VC++ runtime signature is $($signature.Status)" }
          if ($signature.SignerCertificate.Subject -notmatch "Microsoft Corporation") {
            throw "VC++ runtime is not signed by Microsoft Corporation"
          }
          "VC_REDIST_PATH=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Download and verify Inno Setup Chinese translation
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "ChineseSimplified.isl"
          $url = "https://api.github.com/repos/jrsoftware/issrc/contents/Files/Languages/ChineseSimplified.isl?ref=6ef32198ef1f7b7b375cd4b6b90896c2a58eb4c2"
          $headers = @{ Accept = "application/vnd.github+json"; "User-Agent" = "BestYolo-Build" }
          $response = Invoke-RestMethod -Uri $url -Headers $headers
          [IO.File]::WriteAllBytes($target, [Convert]::FromBase64String(($response.content -replace '\s', '')))
          $expected = "e0b0b350e2245f3c5e65586dfe43d574f6e7f06f2261149aba284954b3fc9a8d"
          $actual = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Inno Setup Chinese translation SHA256 mismatch" }
          "INNO_CHINESE_PATH=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test Windows packaging logic
        shell: pwsh
        run: |
          python -m py_compile autolabel_qwen.py build_dataset.py palette.py gui/app.py gui/appmeta.py gui/core.py gui/promptai.py gui/runner.py gui/theme.py gui/theme_settings.py gui/update_check.py packaging/build_windows.py packaging/windows_entry.py packaging/windows_worker.py
          python -B packaging/test_windows_packaging.py
          $env:QT_QPA_PLATFORM = "offscreen"
          python -B gui/test_shortcuts.py
          python -B gui/test_themes.py
          python -B gui/test_update_dialog_qt.py
          python -B gui/test_updates.py
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:INPUT_VERSION) {
            $version = $env:INPUT_VERSION
          } else {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          $appVersion = python -c "import sys; sys.path.insert(0,'gui'); from appmeta import APP_VERSION; print(APP_VERSION)"
          if ($version -ne $appVersion) { throw "Release version $version does not match app version $appVersion" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Build Windows installer
        shell: pwsh
        run: python packaging/build_windows.py --version "${{ steps.version.outputs.version }}" --vc-redist "$env:VC_REDIST_PATH" --inno-chinese "$env:INNO_CHINESE_PATH"
      - name: Validate, install, exercise and uninstall
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $setup = Resolve-Path "dist\BestYolo-Setup-$version-win64.exe"
          $checksum = Resolve-Path "dist\BestYolo-Setup-$version-win64.exe.sha256"
          $expected = ((Get-Content $checksum) -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Installer SHA256 mismatch" }

          $installDir = Join-Path $env:RUNNER_TEMP "BestYoloInstalled"
          $install = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir" -Wait -PassThru
          if ($install.ExitCode -notin 0, 3010) { throw "Installer exit code: $($install.ExitCode)" }
          $app = Join-Path $installDir "BestYolo.exe"
          $worker = Join-Path $installDir "BestYoloWorker.exe"
          if (-not (Test-Path $app) -or -not (Test-Path $worker)) { throw "Installed executables are missing" }

          $smokeRoot = Join-Path $env:RUNNER_TEMP "BestYoloSmoke"
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
          $env:BEST_YOLO_DATA_DIR = Join-Path $smokeRoot "data"
          $env:QT_QPA_PLATFORM = "offscreen"
          $smokeJson = Join-Path $smokeRoot "gui-smoke.json"
          $smoke = Start-Process -FilePath $app -ArgumentList "--smoke-test", $smokeJson -Wait -PassThru
          if ($smoke.ExitCode -ne 0 -or -not (Test-Path $smokeJson)) { throw "Frozen GUI smoke test failed" }
          $smokeResult = Get-Content $smokeJson -Raw | ConvertFrom-Json
          if (-not $smokeResult.smoke_ok -or -not $smokeResult.worker_exists -or
              $smokeResult.pages -ne 5 -or $smokeResult.app_version -ne $version -or
              $smokeResult.update_button -ne "检测更新" -or
              $smokeResult.theme_button -ne "ThemeSettingsButton" -or
              -not $smokeResult.theme_icon) {
            throw "Frozen GUI reported an invalid runtime"
          }

          $workerLog = Join-Path $smokeRoot "worker-self-test.log"
          $workerErr = Join-Path $smokeRoot "worker-self-test.err"
          $workerTest = Start-Process -FilePath $worker -ArgumentList "self-test" -RedirectStandardOutput $workerLog -RedirectStandardError $workerErr -Wait -PassThru
          if ($workerTest.ExitCode -ne 0 -or (Get-Content $workerLog -Raw) -notmatch '"ok": true') {
            throw "Frozen worker self-test failed: $(Get-Content $workerErr -Raw)"
          }

          $images = Join-Path $smokeRoot "images"
          $labels = Join-Path $smokeRoot "labels"
          $dataset = Join-Path $smokeRoot "dataset"
          New-Item -ItemType Directory -Force -Path $images, $labels | Out-Null
          python -c "from PIL import Image; Image.new('RGB',(32,24),'white').save(r'$images\sample.png')"
          "0 0.5 0.5 0.25 0.25" | Out-File -FilePath "$labels\sample.txt" -Encoding ascii
          $datasetLog = Join-Path $smokeRoot "dataset.log"
          $datasetErr = Join-Path $smokeRoot "dataset.err"
          $datasetTest = Start-Process -FilePath $worker -ArgumentList "dataset", "--images", $images, "--labels", $labels, "--out", $dataset, "--classes", "猫,狗", "--ext", "auto" -RedirectStandardOutput $datasetLog -RedirectStandardError $datasetErr -Wait -PassThru
          if ($datasetTest.ExitCode -ne 0) { throw "Frozen dataset worker failed: $(Get-Content $datasetErr -Raw)" }
          python -c "import pathlib,yaml; p=pathlib.Path(r'$dataset'); d=yaml.safe_load((p/'data.yaml').read_text(encoding='utf-8')); assert d['names']=={0:'猫',1:'狗'}; assert (p/'images/train/sample.png').is_file()"

          $preserveDir = Join-Path $env:LOCALAPPDATA "BestYolo"
          New-Item -ItemType Directory -Force -Path $preserveDir | Out-Null
          $marker = Join-Path $preserveDir "uninstall-preserves-data.txt"
          "keep" | Out-File -FilePath $marker -Encoding ascii
          $uninstaller = Join-Path $installDir "unins000.exe"
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exit code: $($uninstall.ExitCode)" }
          if (Test-Path $app) { throw "Application remained after uninstall" }
          if (-not (Test-Path $marker)) { throw "Uninstall deleted user data" }
          Remove-Item $marker -Force
      - uses: actions/upload-artifact@v4
        with:
          name: best-yolo-${{ steps.version.outputs.version }}-windows10-x64
          retention-days: 7
          path: |
            dist/BestYolo-Setup-*-win64.exe
            dist/BestYolo-Setup-*-win64.exe.sha256
            dist/INSTALL-Windows10-zh-CN.txt

  publish:
    needs: [deb, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Resolve release tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            TAG="v$INPUT_VERSION"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          NOTES="docs/release-notes/$TAG.md"
          if [ ! -f "$NOTES" ]; then
            echo "缺少 $NOTES；每个版本必须写明新增功能和修复内容" >&2
            exit 1
          fi
          grep -Fxq '## 新增功能' "$NOTES"
          grep -Fxq '## 修复内容' "$NOTES"
          grep -Fq "## [$TAG]" docs/releases.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ls -lh release-assets
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --notes-file "${{ steps.version.outputs.notes }}" --title "Best yolo $TAG" --latest
          fi
          CURRENT_ASSETS="$(find release-assets -maxdepth 1 -type f -printf '%f\n')"
          while IFS= read -r ASSET; do
            case "$ASSET" in
              best-yolo_*_amd64.deb|best-yolo_*_amd64.deb.sha256|BestYolo-Setup-*-win64.exe|BestYolo-Setup-*-win64.exe.sha256|INSTALL-Ubuntu22.04-zh-CN.txt|INSTALL-Windows10-zh-CN.txt)
                if ! printf '%s\n' "$CURRENT_ASSETS" | grep -Fxq "$ASSET"; then
                  echo "删除同版本内已被替代的附件: $ASSET"
                  gh release delete-asset "$TAG" "$ASSET" --yes
                fi
                ;;
            esac
          done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
          gh release edit "$TAG" --notes-file "${{ steps.version.outputs.notes }}" --title "Best yolo $TAG" --latest
